```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus Complaint System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #cccccc;
        }

        h1, h2 {
            color: #1d4ed8;
            text-align: center;
        }

        p {
            text-align: center;
            color: #555555;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #dddddd;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Smart Campus Complaint System</h1>
        <p>Report campus problems and track your complaints.</p>

        <h2>Submit a Complaint</h2>

        <form method="POST" action="/submit">
            <label for="student_name">Student name</label>
            <input type="text" id="student_name"
                   name="student_name" required>

            <label for="category">Complaint Category</label>
            <select id="category" name="category" required>
                <option value="">Select Category</option>
                <option value="Cleanliness">Cleanliness</option>
                <option value="Electricity">Electricity</option>
                <option value="Water">Water</option>
                <option value="Classroom">Classroom</option>
                <option value="Other">Other</option>
            </select>

            <label for="location">Campus Location</label>
            <input type="text" id="location"
                   name="location" required>

            <label for="description">Complaint Description</label>
            <textarea id="description" name="description"
                      rows="5" required></textarea>

            <button type="submit">Submit Complaint</button>
        </form>

        <div class="section">
            <h2>Track Your Complaint</h2>
            <p>Enter your Complaint ID to check its current status.</p>

            <form method="GET" action="/track">
                <label for="complaint_id">Complaint ID</label>
                <input type="number" id="complaint_id"
                       name="complaint_id" min="1" required>

                <button type="submit">Check Status</button>
            </form>
        </div>
    </div>
</body>
</html>
```
